<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#173f35" />
  <title>공동 가계부</title>
  <link rel="stylesheet" href="/assets/css/app.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">HOUSEHOLD BOOK</p>
        <h1>공동 가계부</h1>
      </div>
      <button id="refreshBtn" class="icon-btn" type="button" aria-label="새로고침">↻</button>
    </header>

    <main>
      <section class="month-bar card">
        <button id="prevMonth" class="month-arrow" type="button" aria-label="이전 달">‹</button>
        <div class="month-center">
          <span class="label">조회 월</span>
          <strong id="monthLabel">2026년 9월</strong>
        </div>
        <button id="nextMonth" class="month-arrow" type="button" aria-label="다음 달">›</button>
      </section>

      <section class="summary-grid" aria-label="월 요약">
        <article class="summary-card primary">
          <span>이번 달 전체 지출</span>
          <strong id="totalExpense">-</strong>
          <small id="expenseBreakdown">생활비 - · 대출 -</small>
        </article>
        <article class="summary-card">
          <span>총무 최종 부담</span>
          <strong id="managerFinal">-</strong>
        </article>
        <article class="summary-card">
          <span>구성원 A 최종 입금</span>
          <strong id="memberAFinal">-</strong>
        </article>
        <article class="summary-card">
          <span>구성원 B 정산액</span>
          <strong id="memberBFinal">-</strong>
        </article>
      </section>

      <section class="card transfer-card">
        <div class="section-heading">
          <div>
            <span class="section-kicker">구성원 B</span>
            <h2>40만원 자동이체 · 이월</h2>
          </div>
          <span class="badge">매월 자동</span>
        </div>
        <div class="transfer-flow">
          <div><span>전월 이월</span><strong id="carryIn">-</strong></div>
          <div class="operator">+</div>
          <div><span>자동이체</span><strong id="autoTransfer">-</strong></div>
          <div class="operator">−</div>
          <div><span>당월 정산</span><strong id="bSettlement">-</strong></div>
          <div class="operator">=</div>
          <div class="result"><span>다음달 이월</span><strong id="carryOut">-</strong></div>
        </div>
        <p id="carryNote" class="helper-text"></p>
      </section>

      <section class="card">
        <div class="section-heading">
          <div>
            <span class="section-kicker">EXPENSES</span>
            <h2>지출 내역</h2>
          </div>
          <button id="addExpenseBtn" class="primary-btn" type="button">+ 지출 추가</button>
        </div>
        <div class="filter-row" id="categoryFilters">
          <button class="chip active" data-filter="전체">전체</button>
          <button class="chip" data-filter="생활비">생활비</button>
          <button class="chip" data-filter="기타/부속">기타/부속</button>
        </div>
        <div id="expenseList" class="expense-list"></div>
        <p id="emptyExpenses" class="empty-state" hidden>등록된 지출이 없습니다.</p>
      </section>

      <section class="card loan-card">
        <div class="section-heading">
          <div>
            <span class="section-kicker">LOAN</span>
            <h2>대출 현황</h2>
          </div>
        </div>
        <div class="loan-grid">
          <div><span>상환 원금</span><strong id="loanPrincipal">-</strong></div>
          <div><span>납부 이자</span><strong id="loanInterest">-</strong></div>
          <div><span>월 상환액</span><strong id="loanTotal">-</strong></div>
          <div><span>상환 후 잔액</span><strong id="loanBalance">-</strong></div>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="주 메뉴">
      <button class="nav-item active" type="button"><span>⌂</span><small>홈</small></button>
      <button class="nav-item" type="button"><span>₩</span><small>가계부</small></button>
      <button class="nav-item" type="button"><span>✓</span><small>정산</small></button>
      <button class="nav-item" type="button"><span>⌁</span><small>대출</small></button>
      <button class="nav-item" type="button"><span>⚙</span><small>설정</small></button>
    </nav>
  </div>

  <dialog id="expenseDialog" class="dialog">
    <form id="expenseForm" method="dialog" class="dialog-card">
      <div class="dialog-header">
        <h2>지출 추가</h2>
        <button class="close-btn" value="cancel" type="submit" aria-label="닫기">×</button>
      </div>
      <label>월<input id="expenseMonth" name="month" type="month" required /></label>
      <label>대분류
        <select id="expenseCategory" name="category" required>
          <option value="생활비">생활비</option>
          <option value="기타/부속">기타/부속</option>
        </select>
      </label>
      <label>소분류<input name="subcategory" type="text" placeholder="예: 관리비" required /></label>
      <label>내역/비고<input name="description" type="text" placeholder="예: 아파트 관리비" /></label>
      <label>금액<input name="amount" type="number" inputmode="numeric" min="0" step="1" required /></label>
      <label>분담방식
        <select name="splitType" required>
          <option value="3인 공동">3인 공동</option>
          <option value="총무+구성원 A 부담">총무 + 구성원 A</option>
        </select>
      </label>
      <button class="primary-btn full" type="submit" value="default">저장</button>
      <p class="helper-text">Google Sheet 연결 전에는 화면에서만 임시 반영됩니다.</p>
    </form>
  </dialog>

  <script src="/assets/js/app.js" type="module"></script>
</body>
</html>
